<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <style>
      /* ==================== KEYFRAME ANIMATIONS ==================== */
      
      /* Startup Boot Flash */
      @keyframes systemBoot {
        0% { opacity: 0; filter: brightness(0.2); }
        30% { opacity: 0.9; filter: brightness(2.5); }
        50% { opacity: 0.5; filter: brightness(0.8); }
        70% { opacity: 1; filter: brightness(1.6); }
        100% { opacity: 1; filter: brightness(1); }
      }

      /* Self-Drawing Cyber Frame */
      @keyframes drawFrame {
        0% { stroke-dashoffset: 2600; opacity: 0.2; }
        70% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.9; }
      }

      /* Title Zoom & Flare Reveal */
      @keyframes titleReveal {
        0% { opacity: 0; transform: translateY(16px) scale(0.9); }
        60% { opacity: 1; transform: translateY(-2px) scale(1.02); }
        100% { opacity: 1; transform: translateY(0px) scale(1); }
      }

      /* Subtitle Slide-in */
      @keyframes subReveal {
        0% { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0px); }
      }

      /* Ambient Light Orbs Drifting */
      @keyframes orbMove1 {
        0% { cx: 200px; cy: 120px; r: 130px; opacity: 0.25; }
        50% { cx: 700px; cy: 150px; r: 170px; opacity: 0.4; }
        100% { cx: 200px; cy: 120px; r: 130px; opacity: 0.25; }
      }

      @keyframes orbMove2 {
        0% { cx: 750px; cy: 160px; r: 140px; opacity: 0.18; }
        50% { cx: 250px; cy: 100px; r: 130px; opacity: 0.32; }
        100% { cx: 750px; cy: 160px; r: 140px; opacity: 0.18; }
      }

      /* Cyberpunk Horizontal Scanner Line */
      @keyframes laserScan {
        0% { y: 15px; opacity: 0; }
        15% { opacity: 0.9; }
        85% { opacity: 0.9; }
        100% { y: 245px; opacity: 0; }
      }

      /* Equalizer Waveform Bounces */
      @keyframes eqBar1 { 0%, 100% { height: 6px; y: 132px; } 50% { height: 28px; y: 121px; } }
      @keyframes eqBar2 { 0%, 100% { height: 16px; y: 127px; } 50% { height: 38px; y: 116px; } }
      @keyframes eqBar3 { 0%, 100% { height: 30px; y: 120px; } 50% { height: 10px; y: 130px; } }
      @keyframes eqBar4 { 0%, 100% { height: 38px; y: 116px; } 50% { height: 18px; y: 126px; } }
      @keyframes eqBar5 { 0%, 100% { height: 12px; y: 129px; } 50% { height: 32px; y: 119px; } }

      /* Corner Tactical HUD Rotations */
      @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

      /* Floating Cyber Data Micro-Particles */
      @keyframes dataFloat1 { 0% { transform: translateY(0px); opacity: 0.1; } 50% { opacity: 0.9; } 100% { transform: translateY(-50px); opacity: 0; } }
      @keyframes dataFloat2 { 0% { transform: translateY(0px); opacity: 0.2; } 50% { opacity: 0.8; } 100% { transform: translateY(-60px); opacity: 0; } }
      @keyframes dataFloat3 { 0% { transform: translateY(0px); opacity: 0.1; } 50% { opacity: 1; } 100% { transform: translateY(-45px); opacity: 0; } }

      /* Live Green Pulse & Ripple */
      @keyframes statusPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      @keyframes statusRipple { 0% { r: 4px; opacity: 0.9; } 100% { r: 15px; opacity: 0; } }

      /* Bottom Laser Expand */
      @keyframes bottomLaserPulse {
        0%, 100% { width: 340px; x: 280px; opacity: 0.6; }
        50% { width: 560px; x: 170px; opacity: 1; }
      }

      /* Class Mappings */
      .anim-boot { animation: systemBoot 1.2s ease-out forwards; }
      .anim-border { stroke-dasharray: 2600; animation: drawFrame 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .anim-title { animation: titleReveal 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; opacity: 0; transform-origin: 450px 125px; }
      .anim-sub1 { animation: subReveal 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; opacity: 0; }
      .anim-sub2 { animation: subReveal 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.85s forwards; opacity: 0; }

      .anim-orb1 { animation: orbMove1 10s ease-in-out infinite; }
      .anim-orb2 { animation: orbMove2 12s ease-in-out infinite; }
      .anim-scanner { animation: laserScan 3.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

      .anim-reticle-l { animation: spinCW 9s linear infinite; transform-origin: 50px 130px; }
      .anim-reticle-r { animation: spinCCW 9s linear infinite; transform-origin: 850px 130px; }

      .eq1 { animation: eqBar1 1.4s ease-in-out infinite; }
      .eq2 { animation: eqBar2 1.1s ease-in-out 0.2s infinite; }
      .eq3 { animation: eqBar3 1.6s ease-in-out 0.4s infinite; }
      .eq4 { animation: eqBar4 1.2s ease-in-out 0.1s infinite; }
      .eq5 { animation: eqBar5 1.5s ease-in-out 0.3s infinite; }

      .dp1 { animation: dataFloat1 2.8s ease-in-out infinite; }
      .dp2 { animation: dataFloat2 3.4s ease-in-out 1.2s infinite; }
      .dp3 { animation: dataFloat3 3.0s ease-in-out 0.6s infinite; }

      .status-dot { animation: statusPulse 1.8s ease-in-out infinite; }
      .status-ring { animation: statusRipple 1.8s cubic-bezier(0.1, 0.8, 0.3, 1) infinite; }
      .anim-laser-bar { animation: bottomLaserPulse 4s ease-in-out infinite; }
    </style>

    <!-- Base Gradients -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121211" />
      <stop offset="50%" stop-color="#181716" />
      <stop offset="100%" stop-color="#0a0a09" />
    </linearGradient>

    <!-- Animated Incandescent Flame Gradient for Title -->
    <linearGradient id="flame-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5738">
        <animate attributeName="stop-color" values="#FF5738; #F84525; #FFE082; #F84525; #FF5738" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#F84525">
        <animate attributeName="stop-color" values="#F84525; #FFE082; #FF5738; #FFE082; #F84525" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#E02E0E">
        <animate attributeName="stop-color" values="#E02E0E; #FF5738; #F84525; #FF5738; #E02E0E" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Laser Scanner Gradient -->
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F84525" stop-opacity="0" />
      <stop offset="25%" stop-color="#FF5738" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="75%" stop-color="#FF5738" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F84525" stop-opacity="0" />
    </linearGradient>

    <!-- Bottom Bar Glow Gradient -->
    <linearGradient id="bar-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F84525" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF5738" stop-opacity="1" />
      <stop offset="100%" stop-color="#F84525" stop-opacity="0" />
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.035"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="orb-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="bloom-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g class="anim-boot">
    <!-- Main Background Canvas -->
    <rect width="900" height="260" rx="16" fill="url(#cyber-bg)" />
    <rect width="900" height="260" rx="16" fill="url(#cyber-grid)" />

    <!-- Kinetic Flame Light Orbs -->
    <circle class="anim-orb1" cx="200" cy="120" r="140" fill="#F84525" filter="url(#orb-blur)" />
    <circle class="anim-orb2" cx="700" cy="150" r="150" fill="#FF5738" filter="url(#orb-blur)" />

    <!-- Animated Cyber Scanner Line -->
    <rect class="anim-scanner" x="15" y="15" width="870" height="2" fill="url(#scan-grad)" filter="url(#bloom-filter)" />

    <!-- Floating Cyber Data Particles -->
    <circle class="dp1" cx="220" cy="180" r="2" fill="#FF7A59" />
    <circle class="dp2" cx="680" cy="190" r="2.5" fill="#FFE082" />
    <circle class="dp3" cx="740" cy="160" r="1.8" fill="#FF5738" />

    <!-- Top Window Console Bar -->
    <circle cx="35" cy="28" r="5" fill="#FF5F56" />
    <circle cx="53" cy="28" r="5" fill="#FFBD2E" />
    <circle cx="71" cy="28" r="5" fill="#27C93F" />
    <text x="96" y="32" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600" letter-spacing="1">raghav@neural-core // AI_SYS_READY</text>

    <!-- Top Right Telemetry & Status -->
    <circle class="status-ring" cx="780" cy="28" r="4" fill="none" stroke="#27C93F" stroke-width="1.5" />
    <circle class="status-dot" cx="780" cy="28" r="4.5" fill="#27C93F" />
    <text x="796" y="32" fill="#27C93F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" letter-spacing="1">● ONLINE</text>

    <!-- Header Divider Line -->
    <line x1="20" y1="48" x2="880" y2="48" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Left Tactical Reticle & Neural Wave Equalizer -->
    <g class="anim-reticle-l">
      <circle cx="50" cy="130" r="18" fill="none" stroke="#F84525" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="8, 4"/>
      <path d="M 50 107 L 50 153 M 27 130 L 73 130" stroke="#F84525" stroke-opacity="0.25" stroke-width="0.8"/>
    </g>
    <!-- Left Equalizer Bars -->
    <g fill="#F84525" opacity="0.7">
      <rect class="eq1" x="80" y="132" width="3" height="6" rx="1.5" />
      <rect class="eq2" x="86" y="127" width="3" height="16" rx="1.5" />
      <rect class="eq3" x="92" y="120" width="3" height="30" rx="1.5" />
      <rect class="eq4" x="98" y="116" width="3" height="38" rx="1.5" />
      <rect class="eq5" x="104" y="129" width="3" height="12" rx="1.5" />
    </g>

    <!-- Right Tactical Reticle & Neural Wave Equalizer -->
    <g class="anim-reticle-r">
      <circle cx="850" cy="130" r="18" fill="none" stroke="#F84525" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="8, 4"/>
      <path d="M 850 107 L 850 153 M 827 130 L 873 130" stroke="#F84525" stroke-opacity="0.25" stroke-width="0.8"/>
    </g>
    <!-- Right Equalizer Bars -->
    <g fill="#F84525" opacity="0.7">
      <rect class="eq5" x="793" y="129" width="3" height="12" rx="1.5" />
      <rect class="eq4" x="799" y="116" width="3" height="38" rx="1.5" />
      <rect class="eq3" x="805" y="120" width="3" height="30" rx="1.5" />
      <rect class="eq2" x="811" y="127" width="3" height="16" rx="1.5" />
      <rect class="eq1" x="817" y="132" width="3" height="6" rx="1.5" />
    </g>

    <!-- Center Typography: RAGHAV S -->
    <g class="anim-title">
      <!-- Ambient Glow Behind Name -->
      <text x="450" y="124" text-anchor="middle" fill="#F84525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="6" opacity="0.45" filter="url(#bloom-filter)">RAGHAV S</text>
      <!-- Main Kinetic Flame Title -->
      <text x="450" y="124" text-anchor="middle" fill="url(#flame-title)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="6">RAGHAV S</text>
    </g>

    <!-- Subtitle 1: AI & ML ENGINEER -->
    <g class="anim-sub1">
      <text x="450" y="162" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="14" font-weight="700" letter-spacing="3" opacity="0.95">AI &amp; MACHINE LEARNING ENGINEER</text>
    </g>

    <!-- Subtitle 2: SPECIALIZATIONS -->
    <g class="anim-sub2">
      <text x="450" y="190" text-anchor="middle" fill="#A8A8A8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="600" letter-spacing="1.5">PREDICTIVE MODELING · RAG SYSTEMS · FULL-STACK ARCHITECT</text>
    </g>

    <!-- Dynamic Expanding Laser Underline -->
    <rect class="anim-laser-bar" x="250" y="222" width="400" height="2.5" rx="1.25" fill="url(#bar-glow)" filter="url(#bloom-filter)" />

    <!-- Animated Breathing Frame Border -->
    <rect class="anim-border" width="900" height="260" rx="16" fill="none" stroke="#F84525" stroke-width="1.8" />
  </g>
</svg>
