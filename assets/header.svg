<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141413" />
      <stop offset="50%" stop-color="#1c1b1a" />
      <stop offset="100%" stop-color="#0d0d0c" />
    </linearGradient>
    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5738" />
      <stop offset="50%" stop-color="#F84525" />
      <stop offset="100%" stop-color="#E02E0E" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F84525" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF7A59" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="240" rx="16" fill="url(#bg-grad)" stroke="#F84525" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect width="900" height="240" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Orb -->
  <circle cx="450" cy="120" r="160" fill="#F84525" opacity="0.12" filter="url(#glow)"/>

  <!-- Top Terminal Bar -->
  <circle cx="35" cy="30" r="5.5" fill="#FF5F56" />
  <circle cx="55" cy="30" r="5.5" fill="#FFBD2E" />
  <circle cx="75" cy="30" r="5.5" fill="#27C93F" />
  <text x="105" y="34" fill="#666666" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" letter-spacing="1">raghav@dev-neural-core: ~</text>
  <text x="780" y="34" fill="#27C93F" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600" letter-spacing="1">● ONLINE</text>

  <!-- Divider Line -->
  <line x1="20" y1="52" x2="880" y2="52" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Main Name Title with Glowing Accent -->
  <text x="450" y="118" text-anchor="middle" fill="url(#flame-grad)" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="4">RAGHAV S</text>

  <!-- Subtitle -->
  <text x="450" y="152" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600" letter-spacing="2.5" opacity="0.95">AI &amp; MACHINE LEARNING ENGINEER</text>

  <!-- Secondary Line -->
  <text x="450" y="180" text-anchor="middle" fill="#A0A0A0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" letter-spacing="1.5">PREDICTIVE MODELING · RAG SYSTEMS · FULL-STACK ARCHITECT</text>

  <!-- Bottom Accent Bar -->
  <rect x="250" y="208" width="400" height="2" rx="1" fill="url(#glow-grad)" />
</svg>
