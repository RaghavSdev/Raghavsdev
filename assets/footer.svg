<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" width="100%" height="100%">
  <defs>
    <style>
      @keyframes footGlow {
        0% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
        100% { stroke-opacity: 0.3; }
      }
      @keyframes footBeam {
        0% { x: 50px; opacity: 0; }
        50% { opacity: 0.8; }
        100% { x: 750px; opacity: 0; }
      }
      .foot-border { animation: footGlow 3s ease-in-out infinite; }
      .foot-scanner { animation: footBeam 4s linear infinite; }
    </style>
    <linearGradient id="foot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141413" />
      <stop offset="100%" stop-color="#0d0d0c" />
    </linearGradient>
    <linearGradient id="foot-flame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="50%" stop-color="#F84525" />
      <stop offset="100%" stop-color="#FF3815" />
    </linearGradient>
    <linearGradient id="foot-beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F84525" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F84525" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="900" height="70" rx="12" fill="url(#foot-bg)" />
  <rect class="foot-scanner" x="50" y="2" width="120" height="1" fill="url(#foot-beam-grad)" />
  <text x="450" y="32" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="700" letter-spacing="2">THANK YOU FOR VISITING! ✨</text>
  <text x="450" y="52" text-anchor="middle" fill="url(#foot-flame)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600" letter-spacing="1">LET'S BUILD INTELLIGENT SYSTEMS TOGETHER · @RaghavSdev</text>
  <rect class="foot-border" width="900" height="70" rx="12" fill="none" stroke="#F84525" stroke-width="1.2" />
</svg>
